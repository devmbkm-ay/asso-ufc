services:

  # ── Base de données PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-asso_db}
      POSTGRES_USER:     ${POSTGRES_USER:-asso_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # bindé en local uniquement — jamais exposé publiquement (DBeaver/TablePlus via tunnel SSH)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asso_user} -d ${POSTGRES_DB:-asso_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API FastAPI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # attend que postgres soit prêt
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asso_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-asso_db}
      SECRET_KEY:   ${SECRET_KEY:-changeme-dev-only}
      DEBUG:        ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      BREVO_API_KEY:      ${BREVO_API_KEY:-}
      EMAIL_FROM:         ${EMAIL_FROM:-noreply@asso.fr}
      EMAIL_FROM_NAME:    ${EMAIL_FROM_NAME:-Association}
      VAPID_PUBLIC_KEY:   ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:  ${VAPID_PRIVATE_KEY:-}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-mailto:noreply@asso.fr}
      PAYPAL_RECIPIENT:   ${PAYPAL_RECIPIENT:-}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app                      # hot-reload en dev (retiré en prod)

volumes:
  postgres_data:
